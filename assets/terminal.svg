<rect y="36" width="900" height="2" fill="url(#bar)" opacity=".7"/>
<g class="in" style="animation-delay:0.50s"><text x="28" y="64"><tspan fill="#ec4899">➜</tspan> <tspan fill="#00f3ff">~</tspan> <tspan fill="#fff">whoami</tspan></text><rect class="cov c0" x="65.2" y="47" width="70.80000000000001" height="24" fill="#0b0b10"/></g><text class="in" x="28" y="88" style="animation-delay:1.18s"><tspan fill="#fff">alexander_sadhana</tspan><tspan fill="#71717a">  // IT &amp; genomics enthusiast, developer</tspan></text><g class="in" style="animation-delay:1.30s"><text x="28" y="112"><tspan fill="#ec4899">➜</tspan> <tspan fill="#00f3ff">~</tspan> <tspan fill="#fff">cat about.txt</tspan></text><rect class="cov c1" x="65.2" y="95" width="139.4" height="24" fill="#0b0b10"/></g><text class="in" x="28" y="136" style="animation-delay:2.36s"><tspan fill="#d4d4d8">I love working with people who pay attention to the little</tspan></text><text class="in" x="28" y="160" style="animation-delay:2.48s"><tspan fill="#d4d4d8">things and put in the extra effort. Every project is a way to</tspan></text><text class="in" x="28" y="184" style="animation-delay:2.60s"><tspan fill="#d4d4d8">learn something new and make technology feel natural to use.</tspan></text><g class="in" style="animation-delay:2.73s"><text x="28" y="208"><tspan fill="#ec4899">➜</tspan> <tspan fill="#00f3ff">~</tspan> <tspan fill="#fff">ls ./focus</tspan></text><rect class="cov c2" x="65.2" y="191" width="110" height="24" fill="#0b0b10"/></g><text class="in" x="28" y="232" style="animation-delay:3.63s"><tspan fill="#00f3ff">artificial_intelligence/  genomics/  fullstack_dev/</tspan></text><text class="in" x="28" y="256" style="animation-delay:3.75s"><tspan fill="#00f3ff">iot_arduino/  ai_cinema/  game_dev/  photography/</tspan></text><g class="in" style="animation-delay:3.87s"><text x="28" y="280"><tspan fill="#ec4899">➜</tspan> <tspan fill="#00f3ff">~</tspan> <tspan fill="#fff">cat status.log</tspan></text><rect class="cov c3" x="65.2" y="263" width="149.20000000000002" height="24" fill="#0b0b10"/></g><text class="in" x="28" y="304" style="animation-delay:4.99s"><tspan fill="#4ade80">● </tspan><tspan fill="#d4d4d8">tinkering since the 2020 lockdown, starting with Arduino</tspan></text><text class="in" x="28" y="328" style="animation-delay:5.11s"><tspan fill="#4ade80">● </tspan><tspan fill="#d4d4d8">based in Bantul, Yogyakarta, Indonesia</tspan></text><text class="in" x="28" y="352" style="animation-delay:5.23s"><tspan fill="#ec4899">● </tspan><tspan fill="#d4d4d8">open to collaboration: AI, bioinformatics, web</tspan></text><g class="in" style="animation-delay:5.35s"><text x="28" y="376"><tspan fill="#ec4899">➜</tspan> <tspan fill="#00f3ff">~</tspan> </text><rect class="blink" x="67.2" y="361" width="9" height="18" fill="#00f3ff"/></g>
</svg>