<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 406" width="900" height="406" role="img" aria-label="Terminal: whoami — Alexander Sadhana, IT and genomics enthusiast and developer from Bantul, Yogyakarta">
<style>
  text{font-family:'JetBrains Mono','Cascadia Code','Fira Code',Consolas,'Courier New',monospace;font-size:15px;white-space:pre}
  .in{opacity:0;animation:show .01s linear both}
  @keyframes show{to{opacity:1}}
  .blink{animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .c0{animation:t0 0.33s steps(6) 0.50s both}@keyframes t0{to{transform:translateX(70.80000000000001px)}}.c1{animation:t1 0.71s steps(13) 1.30s both}@keyframes t1{to{transform:translateX(139.4px)}}.c2{animation:t2 0.55s steps(10) 2.73s both}@keyframes t2{to{transform:translateX(110px)}}.c3{animation:t3 0.77s steps(14) 3.87s both}@keyframes t3{to{transform:translateX(149.20000000000002px)}}
  @media (prefers-reduced-motion: reduce){.in,.cov{animation:none!important}.in{opacity:1}.cov{display:none}}
</style>
<defs><linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#00f3ff"/><stop offset="1" stop-color="#ec4899"/></linearGradient></defs>
<rect width="900" height="406" rx="14" fill="#0b0b10"/>
<rect x=".5" y=".5" width="899" height="405" rx="14" fill="none" stroke="#00f3ff" stroke-opacity=".28"/>
<path d="M14 0.5H886A13.5 13.5 0 0 1 899.5 14V36H0.5V14A13.5 13.5 0 0 1 14 0.5Z" fill="#131318"/>
