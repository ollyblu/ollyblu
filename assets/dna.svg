<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-label="Animated DNA double helix">
<style>
  .rung{stroke:url(#rg);stroke-width:2;stroke-opacity:.45;animation:flip 1.6s ease-in-out infinite alternate}
  .top{fill:#00f3ff;animation:up 1.6s ease-in-out infinite alternate}
  .bot{fill:#ec4899;animation:down 1.6s ease-in-out infinite alternate}
  @keyframes flip{from{transform:scaleY(1)}to{transform:scaleY(-1)}}
  @keyframes up{from{transform:translateY(-42px)}50%{opacity:.45}to{transform:translateY(42px)}}
  @keyframes down{from{transform:translateY(42px)}50%{opacity:.45}to{transform:translateY(-42px)}}
  .base{font-family:'JetBrains Mono','Cascadia Code','Fira Code',Consolas,'Courier New',monospace;font-size:11px;fill:#52525b}
  .label{font-family:'JetBrains Mono','Cascadia Code','Fira Code',Consolas,'Courier New',monospace;font-size:12px;letter-spacing:3px}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
